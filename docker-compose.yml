
name: tp2-nifi

services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nifi_test
      MYSQL_USER: nifi
      MYSQL_PASSWORD: nifi
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 30
    
  spark-master:
    image: tp3-spark:3.5.9
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8090
    environment:
      SPARK_PUBLIC_DNS: localhost
    ports:
      - "8090:8090"

  spark-worker-1:
    image: tp3-spark:3.5.9
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      --cores 2 --memory 1g spark://spark-master:7077

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
  
  trino:
    image: trinodb/trino:484
    container_name: trino
    ports:
      - "8080:8080"
    depends_on:
      - hive-metastore
      - minio
    volumes:
      - ./trino/catalog/lake.properties:/etc/trino/catalog/lake.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro

  postgres:
    image: postgres:16.15-bookworm
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 30

  airflow:
    image: tp5-airflow:3.3.2
    build: ./airflow
    container_name: airflow
    hostname: airflow
    command: airflow standalone
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
      - "8083:8083"
    environment:
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: "true"
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077?deploy-mode=client
      AIRFLOW_CONN_TRINO_DEFAULT: trino://airflow@trino:8080/lake
      AIRFLOW_CONN_MINIO_DEFAULT: >-
        {"conn_type": "aws", "login": "minioadmin", "password": "minioadmin",
        "extra": {"endpoint_url": "http://minio:9000"}}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./jobs:/opt/airflow/jobs
      - ./dbt:/opt/airflow/dbt
      - ./spark/conf:/opt/spark/conf:ro
      - airflow_logs:/opt/airflow/logs

  superset:
    image: tp5-superset:6.1.0
    build: ./superset
    container_name: superset
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: tp5-une-cle-secrete-a-changer-en-production
      DATABASE_URL: postgresql+psycopg2://superset:superset@postgres/superset
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py:ro

  hive-metastore:
    image: tp3-hive-metastore:4.2.1
    container_name: hive-metastore
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "9181:9181"
    environment:
      DB_DRIVER: mysql
    volumes:
      - ./hive/metastore-site.xml:/opt/hive/conf/metastore-site.xml.template:ro
      - ./hive/core-site.xml:/opt/hive/conf/core-site.xml.template:ro

  # Loki
  loki:
    image: grafana/loki:3.7.10
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml -ingester.wal-enabled=false
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  # Alloy
  alloy:
    image: grafana/alloy:v1.22.0
    container_name: alloy
    user: root
    command: >
      run --server.http.listen-addr=0.0.0.0:12345
      /etc/alloy/config.alloy
    depends_on:
      - loki
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - airflow_logs:/opt/airflow/logs:ro

  # Grafana
  grafana:
    image: grafana/grafana:13.2.7
    container_name: grafana
    depends_on:
      - loki
      - postgres
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  mysql_data:
  minio_data:
  postgres_data:
  airflow_logs:
  loki_data:
  grafana_data:
