catalog: airflow
schema: public
sql: "SELECT\n    r.run_id,\n    r.run_type,\n    r.state,\n    to_char(r.logical_date,\
  \ 'YYYY-MM-DD') AS jour_traite,\n    min(t.start_date) AS debut,\n    EXTRACT(\n\
  \        EPOCH FROM max(t.end_date) - min(t.start_date)\n    ) AS duree_s,\n   \
  \ count(*) FILTER (\n        WHERE t.state IN ('failed', 'upstream_failed')\n  \
  \  ) AS taches_ko\nFROM dag_run r\nJOIN task_instance t\n    ON t.dag_id = r.dag_id\n\
  \    AND t.run_id = r.run_id\nWHERE r.dag_id = 'trajets_quotidien'\n    AND r.end_date\
  \ IS NOT NULL\nGROUP BY r.run_id, r.run_type, r.state, r.logical_date;"
