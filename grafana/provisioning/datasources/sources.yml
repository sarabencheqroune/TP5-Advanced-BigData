# Les deux sources de Grafana, déclarées en fichier (versionnées, comme le reste)
apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true

  - name: Airflow (métadonnées)
    uid: airflow-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: airflow
    secureJsonData:
      password: airflow
    jsonData:
      database: airflow
      sslmode: disable
